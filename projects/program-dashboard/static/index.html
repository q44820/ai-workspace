<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>程序总览 · 私人工作台</title><link rel="stylesheet" href="style.css"></head><body><header><div class="eyebrow">PROGRAM DESK / 只读工作台</div><h1>我的程序总览</h1><p>知道哪些在运行，哪些已停用，以及下一次该从哪里继续。</p><div class="meta"><span id="updated">正在读取状态…</span><button id="refresh">立即刷新</button></div></header><main><section id="summary" class="summary"></section><section class="toolbar"><input id="search" placeholder="搜索程序、功能、用途…" aria-label="搜索程序"><select id="status" aria-label="状态筛选"><option value="">全部状态</option><option value="running">运行中</option><option value="scheduled">定时已启用</option><option value="stopped">停止／未安装</option><option value="error">异常</option><option value="manual">手动／代码归档</option><option value="unknown">待核验／已过期</option></select><select id="location" aria-label="位置筛选"><option value="">全部位置</option><option value="日本服务器">日本服务器</option><option value="本机">本机</option></select></section><div id="sync" class="notice"></div><div class="tabs"><button id="show-active" class="selected">在用程序与代码</button><button id="show-all">全部（含旧停用任务）</button></div><div id="error" class="notice error hidden"></div><div id="groups"></div><p id="empty" class="hidden">没有匹配的程序。</p><footer><p id="scope"></p><p id="privacy"></p><p>此页没有启停、交易、账户查询或部署按钮。运行中只代表进程存在；定时启用不代表执行成功。带访问码的链接请勿公开转发。</p><p>服务器状态约15秒缓存，本机每5分钟同步；本机数据超过15分钟自动标为过期。临时HTTPS地址可能变化。</p></footer></main><script src="app.js"></script></body></html>
