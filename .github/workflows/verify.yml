name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency
        run: python3 -m pip install 'pycryptodome>=3.20,<4' 'aiohttp>=3.9,<4'
      - name: Offline checks
        run: python3 scripts/verify_workspace.py
      - name: Scan tracked content
        run: python3 scripts/check_publication.py --all
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check projects/basis-radar/static/app.js
          node --check projects/arb-hub/static/app.js
          node --check projects/program-dashboard/static/app.js
          node --check projects/lp-monitor/scripts/bncb_lp_snapshot.cjs
          node --check projects/anth-bot/paper_engine.js
          node --check projects/anth-bot/paper_app.js
      - name: ANTH paper execution regression
        run: |
          node projects/anth-bot/test_paper_engine.cjs
          node projects/anth-bot/test_paper_ui.cjs
          node projects/anth-bot/test_volume_profit.cjs
          node projects/anth-bot/test_author_volume.cjs
          node projects/anth-bot/test_turnover_volume.cjs
          node projects/anth-bot/live-dashboard/test_status.cjs
          node projects/anth-bot/live-dashboard/test_retired_api.cjs
          python3 -m unittest discover -s projects/program-dashboard -p 'test_dashboard.py'
          python3 -m unittest discover -s projects/anth-bot/live-dashboard -p 'test_publish_status.py'
